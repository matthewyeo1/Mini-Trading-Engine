name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'false'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake build-essential g++-11 libgtest-dev libbenchmark-dev

    - name: Verify Installation (Linux)
      run: |
        cmake --version
        g++-11 --version 
    
    - name: Configure
      run: cmake -B build -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run tests
      run: ./build/tests/velox_tests

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'false'

    - name: Install Chocalatey Dependencies
      shell: pwsh
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        refreshenv

    - name: Verify Installation (Windows)
      shell: pwsh
      run: |
        cmake --version
    
    - name: Configure
      run: cmake -B build -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF
    
    - name: Build
      run: cmake --build build --config Release --parallel
    
    - name: Run tests
      run: ./build/tests/Release/velox_tests.exe